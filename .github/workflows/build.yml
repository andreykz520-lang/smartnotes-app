name: Build Desktop Apps

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Linux (DEB, Tar, AppImage, Snap)
        run: |
          npx expo export
          npx electron-builder --linux deb tar.gz AppImage snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotes-Linux
          path: |
            electron-dist/*.deb
            electron-dist/*.AppImage
            electron-dist/*.snap
            electron-dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Windows (EXE)
        run: npm run build:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotes-Windows
          path: electron-dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SmartNotes-Linux
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SmartNotes-Windows
          path: release-assets

      - name: Download Official Android APK
        run: |
          curl -sSL "https://smartnotes-ai.ru/SmartNotes.apk" -o release-assets/SmartNotes.apk || true
          ls -la release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: SmartNotes AI v1.0.4
          body: |
            ## SmartNotes AI v1.0.4
            
            - 🔐 Исправлен ввод PIN-кода для секретных заметок на ПК (Windows / Linux)
            - ⌨️ Добавлена экранная цифровая клавиатура (мышкой) и поддержка физической клавиатуры (Enter, Backspace, Esc, цифры 0-9)
            - 👁️ Индикаторы ввода точек с возможностью показать/скрыть PIN
            - 💻 Обновленные сборки для Windows (EXE) и Linux (DEB, AppImage, Snap, Tar)
            - 🤖 Выбор ИИ-моделей: Gemini 2.5 Flash, Gemini 2.0 Flash, GigaChat, OpenRouter
            - 💾 Локальный бэкап и экспорт/импорт заметок (JSON)
            - 📱 Официальный APK с подписью RuStore
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
